name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Every package (runtime, pytest, ruff, pip-audit, setuptools) is hash-checked.
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check bee bee_ui bee_web tests app.py
      - name: Format check
        run: ruff format --check bee bee_ui bee_web tests app.py
      - name: Test
        run: pytest
      - name: Sector CSV totals
        run: python tools/check_sector_totals.py
      - name: Dependency audit
        run: pip-audit -r requirements.lock
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Engine smoke test
        run: node scripts/engine-smoke.mjs
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
