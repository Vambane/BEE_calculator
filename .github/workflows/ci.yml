name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" pip-audit
      - name: Lint
        run: ruff check bee tests
      - name: Test
        run: pytest
      - name: Dependency audit
        run: pip-audit -r requirements.txt
