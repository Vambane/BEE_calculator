# v1.3 honey visual language. See ../../honey-visual-pass-bee-calculator.md
# Fonts SELF-HOSTED (no Google CDN, POPIA). Heading family name SourceSerif4 required on Streamlit 1.66.
[server]
enableStaticServing = true

[client]
showErrorDetails = false

[theme]
base = "light"
primaryColor = "#D4A017"
backgroundColor = "#FAF7F0"
secondaryBackgroundColor = "#F3EDE0"
textColor = "#1A1A1A"
borderColor = "#E0D9C8"
font = "Inter, IBM Plex Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
headingFont = "SourceSerif4, Georgia, Times New Roman, serif"
codeFont = "IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Variable.ttf"
weight = "100 700"
style = "normal"

[[theme.fontFaces]]
family = "SourceSerif4"
url = "app/static/fonts/SourceSerif4-Variable.ttf"
weight = "200 900"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Medium.ttf"
weight = "500"
style = "normal"

[theme.sidebar]
backgroundColor = "#F3EDE0"

[browser]
gatherUsageStats = false
