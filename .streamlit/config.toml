# v1 theme. Values from ../tokens.json. Fonts are SELF-HOSTED under static/fonts/ (no Google CDN, POPIA).
# Requires Streamlit >= 1.45 (theme.fontFaces). Files served at app/static/...
[server]
enableStaticServing = true

[client]
showErrorDetails = false

[theme]
base = "light"
primaryColor = "#1F5C4F"
backgroundColor = "#FAF8F3"
secondaryBackgroundColor = "#F0ECE2"
textColor = "#14302B"
borderColor = "#DDD8CC"
font = "IBM Plex Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
headingFont = "SourceSerif4, Georgia, Times New Roman, serif"
codeFont = "IBM Plex Mono, ui-monospace, Menlo, Consolas, monospace"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Variable.ttf"
weight = "100 700"
style = "normal"

[[theme.fontFaces]]
family = "SourceSerif4"
url = "app/static/fonts/SourceSerif4-Variable.ttf"
weight = "200 900"
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-Medium.ttf"
weight = "500"
style = "normal"

[theme.sidebar]
backgroundColor = "#F0ECE2"

[browser]
gatherUsageStats = false
