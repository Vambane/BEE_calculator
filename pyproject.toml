[project]
name = "bee-calculator"
version = "0.1.0"
description = "South African B-BBEE scorecard calculator"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.41.1", "pandas>=2.2.3", "altair>=5.4.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bee", "bee.scorecards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
