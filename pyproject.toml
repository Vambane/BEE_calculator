[project]
name = "bee-calculator"
version = "0.1.0"
description = "South African B-BBEE scorecard calculator"
requires-python = ">=3.11"
dependencies = ["streamlit==1.66.1", "pandas==3.0.6", "altair==5.5.0", "plotly==7.1.0", "weasyprint==70.0", "jinja2==3.1.6"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bee", "bee.scorecards", "bee.sectors", "bee_ui"]

[tool.setuptools.package-data]
"bee.sectors" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E501"]  # long UI copy strings
